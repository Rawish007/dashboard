<!DOCTYPE html>
<html>

<head>

    <title>UMEED ANALYTICS</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="sidebar">

    <h2>UMEED</h2>

    <a href="/">Dashboard</a>
    <a href="/admin">Admin Panel</a>

</div>

<div class="main">

    <h1>Analytics Dashboard</h1>

<div class="cards">

    <div class="card">
        <h3>Total Recovery</h3>
        <p>Rs {{ total }}</p>
    </div>

    <div class="card">
        <h3>Today's Recovery</h3>
        <p>Rs {{ today_total }}</p>
    </div>

    <div class="card">
        <h3>Total Entries</h3>
        <p>{{ total_entries }}</p>
    </div>

</div>
