<!DOCTYPE html>
<html>

<head>

    <title>UMEED ANALYTICS</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="sidebar">

    <h2>UMEED</h2>

    <a href="/">Dashboard</a>
    <a href="/admin">Admin Panel</a>

</div>

<div class="main">

    <h1>Analytics Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h3>Total Recovery</h3>
            <p>Rs {{ total }}</p>
        </div>

    </div>

    <div class="chart-box">
        <canvas id="myChart"></canvas>
    </div>

</div>

<script>

const ctx = document.getElementById('myChart');

new Chart(ctx, {

    type: 'line',

    data: {

        labels: {{ labels|tojson }},

        datasets: [{

            label: 'Recovery',

            data: {{ amounts|tojson }},

            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56,189,248,0.2)',

            tension: 0.4,
            fill:true

        }]
    }

});

</script>

</body>
</html>
