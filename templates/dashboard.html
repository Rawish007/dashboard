<!DOCTYPE html>
<html>
<head>
    <title>UMEED ANALYTICS</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            padding:20px;
        }

        .cards{
            display:flex;
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:#1e293b;
            padding:20px;
            border-radius:15px;
            width:220px;
            box-shadow:0 0 10px rgba(0,0,0,0.4);
        }

        .card h2{
            margin:0;
            font-size:18px;
            color:#94a3b8;
        }

        .card p{
            font-size:28px;
            margin-top:10px;
            color:#38bdf8;
            font-weight:bold;
        }

        .chart-box{
            background:#1e293b;
            padding:20px;
            border-radius:15px;
            margin-top:20px;
        }

    </style>
</head>

<body>

    <h1>UMEED ANALYTICS</h1>

    <div class="cards">

        <div class="card">
            <h2>Today Recovery</h2>
            <p>Rs 45,000</p>
        </div>

        <div class="card">
            <h2>This Week</h2>
            <p>Rs 280,000</p>
        </div>

        <div class="card">
            <h2>This Month</h2>
            <p>Rs 1,093,762</p>
        </div>

        <div class="card">
            <h2>This Year</h2>
            <p>Rs 12.5M</p>
        </div>

    </div>

    <div class="chart-box">
        <canvas id="monthlyChart"></canvas>
    </div>

    <script>

        const ctx = document.getElementById('monthlyChart');

        new Chart(ctx, {
            type: 'line',

            data: {
                labels: [
                    'Week 1',
                    'Week 2',
                    'Week 3',
                    'Week 4'
                ],

                datasets: [{
                    label: 'Monthly Recovery',

                    data: [
                        309885,
                        280930,
                        243852,
                        259045
                    ],

                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56,189,248,0.2)',
                    tension:0.4,
                    fill:true
                }]
            },

            options:{
                responsive:true
            }

        });

    </script>

</body>
</html>
