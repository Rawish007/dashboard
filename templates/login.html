<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UMEED LOGIN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BODY */

body{

    font-family:'Roboto',sans-serif;

    width:100%;
    height:100vh;

    background:#f0f2f5;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

}

/* MAIN CONTAINER */

.container{

    width:100%;
    height:100vh;

    display:flex;

}

/* LEFT SIDE */

.left{

    flex:1;

    background:#ffffff;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:60px;

}

/* CONTENT */

.left-content{

    max-width:520px;

}

.logo{

    font-size:75px;

    font-weight:700;

    color:#2563eb;

    margin-bottom:15px;

    letter-spacing:-2px;

}

.text{

    font-size:30px;

    color:#1c1e21;

    line-height:1.4;

    font-weight:400;

}

/* RIGHT SIDE */

.right{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#f0f2f5;

}

/* LOGIN BOX */

.login-box{

    width:100%;
    max-width:410px;

    background:#fff;

    padding:28px;

    border-radius:14px;

    box-shadow:
    0 2px 12px rgba(0,0,0,0.12);

}

/* FORM */

form{

    display:flex;

    flex-direction:column;

    gap:16px;

}

/* INPUT */

.input{

    width:100%;

    height:56px;

    border:1px solid #dcdfe3;

    border-radius:10px;

    padding:0 16px;

    font-size:17px;

    outline:none;

    transition:0.2s;

    background:#fff;

}

.input:focus{

    border-color:#2563eb;

    box-shadow:
    0 0 0 3px rgba(37,99,235,0.15);

}

/* LOGIN BUTTON */

.login-btn{

    width:100%;

    height:54px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:#fff;

    font-size:20px;

    font-weight:700;

    cursor:pointer;

    transition:0.2s;

}

.login-btn:hover{

    background:#1d4ed8;

}

/* FORGOT */

.forgot{

    text-align:center;

    margin-top:5px;

}

.forgot a{

    text-decoration:none;

    color:#2563eb;

    font-size:15px;

    font-weight:500;

}

.forgot a:hover{

    text-decoration:underline;

}

/* LINE */

.line{

    width:100%;

    height:1px;

    background:#dadde1;

    margin:20px 0;

}

/* CREATE BUTTON */

.create-btn{

    width:220px;

    height:50px;

    margin:auto;

    border:none;

    border-radius:10px;

    background:#16a34a;

    color:#fff;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    display:block;

    transition:0.2s;

}

.create-btn:hover{

    background:#15803d;

}

/* FOOTER */

.footer{

    margin-top:28px;

    text-align:center;

    font-size:14px;

    color:#1c1e21;

}

.footer b{

    font-weight:700;

}

/* MOBILE */

@media(max-width:900px){

    .container{

        flex-direction:column;

        justify-content:center;

        align-items:center;

        padding:20px;

    }

    .left{

        padding:20px;

        text-align:center;

        flex:none;

    }

    .logo{

        font-size:60px;

    }

    .text{

        font-size:24px;

    }

    .right{

        width:100%;

        flex:none;

    }

}

</style>

</head>

<body>

<div class="container">

    <!-- LEFT -->

    <div class="left">

        <div class="left-content">

            <div class="logo">
                UMEED
            </div>

            <div class="text">

                UMEED helps you manage your business analytics,
                sales reports and dashboard securely in one place.

            </div>

        </div>

    </div>

    <!-- RIGHT -->

    <div class="right">

        <div class="login-box">

            <!-- FORM -->

            <form method="POST">

                <!-- USERNAME -->

                <input
                type="text"
                name="username"
                class="input"
                placeholder="Email address or username"
                required>

                <!-- PASSWORD -->

                <input
                type="password"
                name="password"
                class="input"
                placeholder="Password"
                required>

                <!-- LOGIN BUTTON -->

                <button
                type="submit"
                class="login-btn">

                    Log in

                </button>

            </form>

            <!-- FORGOT PASSWORD -->

            <div class="forgot">

                <a href="/forgot-password">

                    Forgotten password?

                </a>

            </div>

            <!-- LINE -->

            <div class="line"></div>

            <!-- CREATE BUTTON -->

            <button class="create-btn">

                Create new account

            </button>

            <!-- FOOTER -->

            <div class="footer">

                <b>UMEED Dashboard</b> Secure Business System

            </div>

        </div>

    </div>

</div>

</body>
</html>
