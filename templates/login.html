<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UMEED Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BODY */

body{

    font-family:'Inter',sans-serif;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    background:
    radial-gradient(circle at top left,#2563eb20,transparent 35%),
    radial-gradient(circle at bottom right,#3b82f620,transparent 35%),
    #f8fafc;

    position:relative;

}

/* FLOATING BLUR */

body::before{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    background:#2563eb18;

    border-radius:50%;

    filter:blur(90px);

    top:-180px;
    left:-180px;

}

body::after{

    content:"";

    position:absolute;

    width:400px;
    height:400px;

    background:#60a5fa18;

    border-radius:50%;

    filter:blur(80px);

    bottom:-150px;
    right:-150px;

}

/* WRAPPER */

.login-wrapper{

    width:100%;
    max-width:450px;

    padding:20px;

    z-index:2;

}

/* CARD */

.login-card{

    background:rgba(255,255,255,0.75);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.4);

    border-radius:32px;

    padding:45px;

    box-shadow:
    0 10px 40px rgba(15,23,42,0.10),
    0 2px 12px rgba(15,23,42,0.05);

    animation:fadeUp 0.8s ease;

    position:relative;

    overflow:hidden;

}

/* TOP GLOW */

.login-card::before{

    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:5px;

    background:linear-gradient(
    90deg,
    #2563eb,
    #3b82f6,
    #60a5fa
    );

}

/* ANIMATION */

@keyframes fadeUp{

    from{

        opacity:0;
        transform:translateY(40px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}

/* LOGO */

.logo-section{

    text-align:center;

    margin-bottom:38px;

}

.logo-icon{

    width:75px;
    height:75px;

    margin:auto;
    margin-bottom:20px;

    border-radius:22px;

    background:linear-gradient(
    135deg,
    #2563eb,
    #60a5fa
    );

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:34px;

    color:white;

    font-weight:800;

    box-shadow:0 10px 25px rgba(37,99,235,0.30);

}

.logo{

    font-size:36px;

    font-weight:800;

    color:#0f172a;

    letter-spacing:1px;

    margin-bottom:10px;

}

.subtitle{

    font-size:15px;

    color:#64748b;

    line-height:1.6;

}

/* FORM */

form{

    display:flex;

    flex-direction:column;

    gap:22px;

}

/* INPUT */

.input-group{

    position:relative;

}

.input-group label{

    display:block;

    margin-bottom:10px;

    font-size:14px;

    font-weight:600;

    color:#334155;

}

.input-group input{

    width:100%;

    height:60px;

    border:1px solid #dbe2ea;

    border-radius:18px;

    background:white;

    padding:0 18px;

    font-size:15px;

    outline:none;

    transition:0.3s;

    color:#0f172a;

}

.input-group input:focus{

    border-color:#2563eb;

    box-shadow:
    0 0 0 5px rgba(37,99,235,0.08);

    transform:translateY(-1px);

}

.input-group input::placeholder{

    color:#94a3b8;

}

/* OPTIONS */

.options{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-top:-5px;

}

.remember{

    display:flex;

    align-items:center;

    gap:8px;

    font-size:14px;

    color:#475569;

}

.forgot{

    text-decoration:none;

    font-size:14px;

    font-weight:600;

    color:#2563eb;

    transition:0.3s;

}

.forgot:hover{

    opacity:0.8;

}

/* BUTTON */

.login-btn{

    height:60px;

    border:none;

    border-radius:18px;

    background:linear-gradient(
    135deg,
    #2563eb,
    #3b82f6
    );

    color:white;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    transition:0.3s;

    margin-top:10px;

    box-shadow:
    0 10px 20px rgba(37,99,235,0.25);

}

.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 15px 30px rgba(37,99,235,0.35);

}

/* FOOTER */

.footer{

    text-align:center;

    margin-top:30px;

    font-size:13px;

    color:#94a3b8;

}

/* MOBILE */

@media(max-width:500px){

    .login-card{

        padding:30px 24px;

        border-radius:28px;

    }

    .logo{

        font-size:30px;

    }

    .logo-icon{

        width:65px;
        height:65px;

        font-size:28px;

    }

}

</style>

</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <!-- LOGO -->

        <div class="logo-section">

            <div class="logo-icon">
                U
            </div>

            <div class="logo">
                UMEED
            </div>

            <div class="subtitle">
                Secure analytics dashboard for business insights and management.
            </div>

        </div>

        <!-- FORM -->

        <form method="POST">

            <!-- USERNAME -->

            <div class="input-group">

                <label>Username</label>

                <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required>

            </div>

            <!-- PASSWORD -->

            <div class="input-group">

                <label>Password</label>

                <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required>

            </div>

            <!-- OPTIONS -->

            <div class="options">

                <label class="remember">

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#" class="forgot">
                    Forgot password?
                </a>

            </div>

            <!-- BUTTON -->

            <button
            type="submit"
            class="login-btn">

                Login to Dashboard

            </button>

        </form>

        <!-- FOOTER -->

        <div class="footer">

            © 2026 UMEED • Private System

        </div>

    </div>

</div>

</body>
</html>
