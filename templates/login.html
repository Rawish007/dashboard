<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UMEED Login</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BODY */

body{

    font-family:'Roboto',sans-serif;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#ffffff;

}

/* LOGIN BOX CENTER */

.login-box{

    width:100%;
    max-width:380px;

    text-align:center;

}

/* LOGO */

.logo{

    font-size:58px;

    font-weight:700;

    color:#2563eb;

    letter-spacing:-1px;

    margin-bottom:10px;

}

/* TAGLINE */

.tagline{

    font-size:18px;

    color:#1c1e21;

    margin-bottom:25px;

    font-weight:400;

}

/* FORM BOX */

.form-box{

    background:#fff;

    padding:20px;

    border-radius:10px;

    box-shadow:
    0 4px 18px rgba(0,0,0,0.12);

}

/* INPUT */

.input{

    width:100%;

    height:52px;

    margin-bottom:12px;

    padding:0 14px;

    border:1px solid #dddfe2;

    border-radius:8px;

    font-size:16px;

    outline:none;

}

.input:focus{

    border-color:#2563eb;

    box-shadow:0 0 0 3px rgba(37,99,235,0.15);

}

/* LOGIN BUTTON */

.login-btn{

    width:100%;

    height:50px;

    border:none;

    border-radius:8px;

    background:#2563eb;

    color:#fff;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    transition:0.2s;

    margin-top:5px;

}

.login-btn:hover{

    background:#1d4ed8;

}

/* FORGOT */

.forgot{

    margin-top:12px;

}

.forgot a{

    font-size:14px;

    color:#2563eb;

    text-decoration:none;

}

.forgot a:hover{

    text-decoration:underline;

}

/* FOOTER */

.footer{

    margin-top:18px;

    font-size:13px;

    color:#65676b;

}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">UMEED</div>

    <div class="tagline">
        Secure Business Dashboard Login
    </div>

    <div class="form-box">

        <form method="POST">

            <input type="text" name="username" class="input" placeholder="Email or Username" required>

            <input type="password" name="password" class="input" placeholder="Password" required>

            <button type="submit" class="login-btn">Log In</button>

        </form>

        <div class="forgot">
            <a href="/forgot-password">Forgotten password?</a>
        </div>

    </div>

    <div class="footer">
        Private • Secure • UMEED System
    </div>

</div>

</body>
</html>
