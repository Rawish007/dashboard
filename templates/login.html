<!DOCTYPE html>
<html>

<head>

<title>UMEED LOGIN</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<style>

/* BODY */

body{
    margin:0;
    padding:0;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:#f8fafc;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:#0f172a;
}

/* LOGIN CONTAINER */

.login-container{
    width:100%;
    max-width:430px;
    padding:20px;
}

/* LOGIN BOX */

.login-box{
    background:white;
    padding:45px;
    border-radius:24px;
    box-shadow:0 10px 40px rgba(0,0,0,0.08);
    border:1px solid #e2e8f0;
}

/* LOGO */

.logo{
    margin-bottom:35px;
}

.logo h1{
    margin:0;
    font-size:38px;
    font-weight:800;
    color:#2563eb;
    letter-spacing:1px;
}

.logo p{
    margin-top:8px;
    color:#64748b;
    font-size:15px;
}

/* FORM */

form{
    display:flex;
    flex-direction:column;
    gap:22px;
}

/* INPUT GROUP */

.input-group{
    display:flex;
    flex-direction:column;
}

.input-group label{
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
    color:#334155;
}

.input-group input{
    padding:16px;
    border:1px solid #cbd5e1;
    border-radius:14px;
    font-size:16px;
    outline:none;
    transition:0.3s;
    background:#fff;
}

.input-group input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,0.08);
}

/* BUTTON */

button{
    margin-top:10px;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

/* FOOTER */

.footer{
    margin-top:30px;
    text-align:center;
    color:#94a3b8;
    font-size:14px;
}

/* TOP LINE */

.top-line{
    width:70px;
    height:5px;
    background:#2563eb;
    border-radius:20px;
    margin-bottom:25px;
}

/* MOBILE */

@media(max-width:500px){

    .login-box{
        padding:30px;
    }

    .logo h1{
        font-size:30px;
    }

}

</style>

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="top-line"></div>

        <!-- LOGO -->

        <div class="logo">

            <h1>UMEED</h1>

            <p>

                Secure Analytics Dashboard Access

            </p>

        </div>

        <!-- LOGIN FORM -->

        <form method="POST">

            <!-- USERNAME -->

            <div class="input-group">

                <label>Username</label>

                <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required>

            </div>

            <!-- PASSWORD -->

            <div class="input-group">

                <label>Password</label>

                <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required>

            </div>

            <!-- BUTTON -->

            <button type="submit">

                Login Dashboard

            </button>

        </form>

        <!-- FOOTER -->

        <div class="footer">

            Private • Secure • Business Analytics

        </div>

    </div>

</div>

</body>
</html>
