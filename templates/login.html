<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UMEED Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<style>

/* BODY */

body{
    margin:0;
    padding:0;
    font-family:'Segoe UI',sans-serif;
    background:#f1f5f9;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* MAIN CONTAINER */

.login-wrapper{
    width:100%;
    max-width:430px;
    padding:20px;
}

/* LOGIN CARD */

.login-card{

    background:white;

    border-radius:28px;

    padding:45px;

    box-shadow:
    0 10px 30px rgba(15,23,42,0.08),
    0 2px 8px rgba(15,23,42,0.04);

    border:1px solid #e2e8f0;

    position:relative;

    overflow:hidden;

}

/* TOP BLUE LINE */

.login-card::before{

    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:6px;

    background:#2563eb;

}

/* LOGO */

.logo-section{

    margin-bottom:35px;

}

.logo{

    font-size:42px;

    font-weight:800;

    color:#0f172a;

    letter-spacing:1px;

    margin-bottom:8px;

}

.subtitle{

    color:#64748b;

    font-size:15px;

    line-height:1.6;

}

/* FORM */

form{

    display:flex;

    flex-direction:column;

    gap:22px;

}

/* INPUT GROUP */

.input-group{

    display:flex;

    flex-direction:column;

}

.input-group label{

    font-size:14px;

    font-weight:600;

    margin-bottom:10px;

    color:#334155;

}

.input-group input{

    height:56px;

    border:1px solid #cbd5e1;

    border-radius:16px;

    padding:0 18px;

    font-size:16px;

    outline:none;

    transition:0.3s;

    background:#fff;

    box-sizing:border-box;

}

.input-group input:focus{

    border-color:#2563eb;

    box-shadow:0 0 0 4px rgba(37,99,235,0.08);

}

/* BUTTON */

.login-btn{

    height:58px;

    border:none;

    border-radius:16px;

    background:#2563eb;

    color:white;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    transition:0.3s;

    margin-top:10px;

}

.login-btn:hover{

    background:#1d4ed8;

    transform:translateY(-2px);

}

/* FOOTER */

.footer{

    margin-top:30px;

    text-align:center;

    color:#94a3b8;

    font-size:14px;

}

/* SECURITY BADGE */

.badge{

    display:inline-block;

    padding:8px 16px;

    background:#eff6ff;

    color:#2563eb;

    border-radius:999px;

    font-size:13px;

    font-weight:600;

    margin-bottom:18px;

}

/* MOBILE */

@media(max-width:500px){

    .login-card{

        padding:30px;

        border-radius:22px;

    }

    .logo{

        font-size:34px;

    }

}

</style>

</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <!-- BADGE -->

        <div class="badge">

            🔒 Secure Login

        </div>

        <!-- LOGO -->

        <div class="logo-section">

            <div class="logo">

                UMEED

            </div>

            <div class="subtitle">

                Private business analytics dashboard with secure access.

            </div>

        </div>

        <!-- FORM -->

        <form method="POST">

            <!-- USERNAME -->

            <div class="input-group">

                <label>Username</label>

                <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required>

            </div>

            <!-- PASSWORD -->

            <div class="input-group">

                <label>Password</label>

                <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required>

            </div>

            <!-- BUTTON -->

            <button
            type="submit"
            class="login-btn">

                Login Dashboard

            </button>

        </form>

        <!-- FOOTER -->

        <div class="footer">

            Private • Secure • Analytics System

        </div>

    </div>

</div>

</body>
</html>
