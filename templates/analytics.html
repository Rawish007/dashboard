<!DOCTYPE html>
<html>
<head>
<title>GROW</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial;background:#f6f8fc;padding:20px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
.box{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
.card{background:white;padding:15px;border-radius:12px}
.top-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.diff{color:green;font-weight:bold}
canvas{margin-top:10px}
</style>
</head>

<body>

<h1>Research</h1>

<div class="top-grid">
<div class="card">Today <h3>{{ today_val }}</h3></div>
<div class="card">Yesterday <h3>{{ yesterday_val }}</h3></div>
<div class="card">Total <h3>{{ total_val }}</h3></div>
</div>

<div class="grid">

<!-- LEFT -->
<div>

<div class="box">
<h3>Daily</h3>
<canvas id="daily"></canvas>
</div>

<div class="box">
<h3>Weekly</h3>
<canvas id="weekly"></canvas>
</div>

<div class="box">
<h3>Monthly</h3>
<canvas id="monthly"></canvas>
</div>

<div class="box">
<h3>Yearly</h3>
<canvas id="yearly"></canvas>
</div>

</div>

<!-- RIGHT -->
<div>

<div class="box">
<h3>Week Compare</h3>
<p>{{ week_now }} vs {{ week_last }}</p>
<canvas id="wcompare"></canvas>
</div>

<div class="box">
<h3>Month Compare</h3>
<p>{{ month_now }} vs {{ month_last }}</p>
<canvas id="mcompare"></canvas>
</div>

<div class="box">
<h3>Year Compare</h3>
<p>{{ year_now }} vs {{ year_last }}</p>
<canvas id="ycompare"></canvas>
</div>

</div>

</div>

<script>

// DAILY
new Chart(document.getElementById("daily"),{
type:"line",
data:{
labels:{{ daily_labels|tojson }},
datasets:[{data:{{ daily_values|tojson }},borderColor:"blue"}]
}
});

// WEEKLY
new Chart(document.getElementById("weekly"),{
type:"line",
data:{
labels:{{ week_labels|tojson }},
datasets:[{data:{{ week_values|tojson }},borderColor:"green"}]
}
});

// MONTHLY
new Chart(document.getElementById("monthly"),{
type:"bar",
data:{
labels:{{ month_labels|tojson }},
datasets:[{data:{{ month_values|tojson }},backgroundColor:"orange"}]
}
});

// YEARLY
new Chart(document.getElementById("yearly"),{
type:"line",
data:{
labels:{{ year_labels|tojson }},
datasets:[{data:{{ year_values|tojson }},borderColor:"red"}]
}
});

// COMPARE
new Chart(document.getElementById("wcompare"),{
type:"bar",
data:{labels:["This","Last"],datasets:[{data:[{{ week_now }},{{ week_last }}]}]}
});

new Chart(document.getElementById("mcompare"),{
type:"bar",
data:{labels:["This","Last"],datasets:[{data:[{{ month_now }},{{ month_last }}]}]}
});

new Chart(document.getElementById("ycompare"),{
type:"bar",
data:{labels:["This","Last"],datasets:[{data:[{{ year_now }},{{ year_last }}]}]}
});

</script>

</body>
</html>
