<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<style>
body{
    font-family:Roboto, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f0f2f5;
}

.box{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 18px rgba(0,0,0,0.12);
    width:350px;
    text-align:center;
}

input{
    width:100%;
    height:50px;
    margin-top:15px;
    padding:0 12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    height:50px;
    margin-top:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>

</head>

<body>

<div class="box">

    <h2>Forgot Password</h2>

    <p>Enter your email to reset password</p>

    <form method="POST">

        <input type="email" name="email" placeholder="Enter email" required>

        <button type="submit">Send Reset Link</button>

    </form>

</div>

</body>
</html>
