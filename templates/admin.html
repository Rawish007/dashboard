<!DOCTYPE html>
<html>

<head>

<title>UMEED Panel</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#f1f5f9;
    display:flex;
    color:#0f172a;
}

/* SIDEBAR */
.sidebar{
    width:240px;
    height:100vh;
    background:#ffffff;
    border-right:1px solid #e2e8f0;
    padding:22px;
}

.logo{
    font-size:22px;
    font-weight:800;
    color:#2563eb;
    margin-bottom:30px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    margin:8px 0;
    text-decoration:none;
    color:#475569;
    border-radius:10px;
    font-size:14px;
    transition:0.2s;
}

.menu a:hover{
    background:#eef2ff;
    color:#1d4ed8;
}

/* MAIN */
.main{
    flex:1;
    padding:30px;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.header h1{
    font-size:22px;
    font-weight:700;
}

.badge{
    background:#dbeafe;
    color:#1d4ed8;
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
}

/* GRID */
.top-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:25px;
}

/* CARD */
.box{
    background:white;
    padding:22px;
    border-radius:16px;
    border:1px solid #e2e8f0;
    box-shadow:0 8px 20px rgba(0,0,0,0.04);
}

.box h2{
    font-size:16px;
    margin-bottom:14px;
    font-weight:700;
}

/* INPUT */
input, select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #e2e8f0;
    border-radius:10px;
    outline:none;
    font-size:14px;
    background:#fff;
}

input:focus, select:focus{
    border-color:#2563eb;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    margin-top:10px;
}

button:hover{
    background:#1d4ed8;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    background:white;
    border-radius:12px;
    overflow:hidden;
}

th{
    text-align:left;
    font-size:13px;
    color:white;
    background:#2563eb;
    padding:12px;
}

td{
    padding:14px 12px;
    border-bottom:1px solid #f1f5f9;
    font-size:14px;
    color:#0f172a;
}

/* ROLE */
.role-admin{color:#ef4444;font-weight:600;}
.role-editor{color:#f59e0b;font-weight:600;}
.role-viewer{color:#3b82f6;font-weight:600;}

/* DELETE */
.delete{
    color:#ef4444;
    text-decoration:none;
    font-weight:600;
}

.delete:hover{
    text-decoration:underline;
}

/* SMALL RESPONSIVE */
@media(max-width:900px){
    .top-grid{
        grid-template-columns:1fr;
    }
    .sidebar{
        display:none;
    }
}

</style>

</head>

<body>

<div class="sidebar">

    <div class="logo">UMEED</div>

    <div class="menu">

        <a href="/"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="/admin"><i class="fa-solid fa-gear"></i> Admin Panel</a>
        <a href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>

    </div>

</div>

<div class="main">

    <div class="header">
        <h1>Admin Panel</h1>
        <div class="badge">Secure System</div>
    </div>

    <div class="top-grid">

        <div class="box">
            <h2>Add Recovery</h2>
            <form method="POST">
                <input type="date" name="day" required>
                <input type="number" name="amount" placeholder="Amount" required>
                <button>Add Recovery</button>
            </form>
        </div>

        <div class="box">
            <h2>Create User</h2>
            <form action="/add-user" method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>

                <select name="role" required>
                    <option value="viewer">Viewer</option>
                    <option value="editor">Editor</option>
                    <option value="admin">Admin</option>
                </select>

                <button>Create User</button>
            </form>
        </div>

    </div>

    <div class="box">

        <h2>Users</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Pass</th>
                <th>Role</th>
                <th>Action</th>
            </tr>

            {% for u in users %}

            <tr>

                <td>{{ u[0] }}</td>
                <td>{{ u[1] }}</td>
                <td>{{ u[2] }}</td>

                <td>
                    {% if u[3] == 'admin' %}
                        <span class="role-admin">Admin</span>
                    {% elif u[3] == 'editor' %}
                        <span class="role-editor">Editor</span>
                    {% else %}
                        <span class="role-viewer">Viewer</span>
                    {% endif %}
                </td>

                <td>
                    <a class="delete" href="/delete-user/{{ u[0] }}">Delete</a>
                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</div>

</body>
</html>
