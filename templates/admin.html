<!DOCTYPE html>
<html>

<head>

<title>UMEED Admin Panel</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#f5f6f8;
    display:flex;
    color:#111;
}

/* SIDEBAR */
.sidebar{
    width:250px;
    height:100vh;
    background:#fff;
    border-right:1px solid #e5e7eb;
    padding:22px;
}

.logo{
    font-size:22px;
    font-weight:800;
    color:#111;
    margin-bottom:30px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    margin:8px 0;
    text-decoration:none;
    color:#444;
    border-radius:10px;
    font-size:14px;
}

.menu a:hover{
    background:#f3f4f6;
    color:#000;
}

/* MAIN */
.main{
    flex:1;
    padding:30px;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.header h1{
    font-size:22px;
    font-weight:700;
}

.badge{
    background:#f3f4f6;
    color:#111;
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    border:1px solid #e5e7eb;
}

/* CARDS */
.box{
    background:#fff;
    padding:22px;
    border-radius:14px;
    border:1px solid #e5e7eb;
    margin-bottom:20px;
}

.box h2{
    font-size:15px;
    font-weight:700;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:10px;
}

/* INPUT */
input, select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #e5e7eb;
    border-radius:10px;
    font-size:14px;
}

input:focus, select:focus{
    border-color:#111;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    background:#111;
    color:#fff;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    margin-top:10px;
}

button:hover{
    background:#000;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th{
    text-align:left;
    font-size:13px;
    color:#111;
    background:#f3f4f6;
    padding:12px;
    border-bottom:1px solid #e5e7eb;
}

td{
    padding:14px 12px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

/* ROLE */
.role-admin{color:#000;font-weight:700;}
.role-editor{color:#333;font-weight:600;}
.role-viewer{color:#555;font-weight:500;}

/* DELETE */
.delete{
    color:#111;
    font-weight:600;
    text-decoration:none;
}

.delete:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="logo">UMEED</div>

    <div class="menu">

        <a href="/"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="/admin"><i class="fa-solid fa-screwdriver-wrench"></i> Admin Panel</a>
        <a href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>

    </div>

</div>

<!-- MAIN -->
<div class="main">

    <div class="header">
        <h1><i class="fa-solid fa-shield-halved"></i> Admin Panel</h1>
        <div class="badge"><i class="fa-solid fa-lock"></i> Secure System</div>
    </div>

    <!-- RECOVERY -->
    <div class="box">
        <h2><i class="fa-solid fa-sack-dollar"></i> Add Recovery</h2>

        <form method="POST">
            <input type="date" name="day" required>
            <input type="number" name="amount" placeholder="Enter Amount" required>
            <button>Add Recovery</button>
        </form>
    </div>

    <!-- CREATE USER -->
    <div class="box">
        <h2><i class="fa-solid fa-user-plus"></i> Create User</h2>

        <form action="/add-user" method="POST">

            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>

            <!-- CLEAN DROPDOWN (NO ICONS) -->
            <select name="role" required>
                <option value="viewer">Viewer</option>
                <option value="editor">Editor</option>
                <option value="admin">Admin</option>
            </select>

            <button>Create User</button>

        </form>
    </div>

    <!-- USERS -->
    <div class="box">

        <h2><i class="fa-solid fa-users"></i> Users</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Pass</th>
                <th>Role</th>
                <th>Action</th>
            </tr>

            {% for u in users %}

            <tr>

                <td>{{ u[0] }}</td>
                <td>{{ u[1] }}</td>
                <td>{{ u[2] }}</td>

                <td>
                    {% if u[3] == 'admin' %}
                        <span class="role-admin">Admin</span>
                    {% elif u[3] == 'editor' %}
                        <span class="role-editor">Editor</span>
                    {% else %}
                        <span class="role-viewer">Viewer</span>
                    {% endif %}
                </td>

                <td>
                    <a class="delete" href="/delete-user/{{ u[0] }}">
                        <i class="fa-solid fa-trash"></i> Delete
                    </a>
                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</div>

</body>
</html>
